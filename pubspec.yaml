name: radhika
description: "Radhika - Cross-platform menstrual health tracking application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod: ^2.6.1
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  fl_chart: ^0.70.2
  flutter_local_notifications: ^18.0.1
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  uuid: ^4.5.1
  google_sign_in: ^6.3.0
  table_calendar: ^3.1.3
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  pdf: ^3.11.3
  printing: ^5.14.2
  csv: ^6.0.0
  shimmer: ^3.0.0
  animate_do: ^4.2.0
  flutter_animate: ^4.5.2
  flex_color_scheme: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/data/
